  <body>    
  <script type="module" defer>
  import Chatbot from "https://cdn.n8nchatui.com/v1/embed.js";
  Chatbot.init({
    "n8nChatUrl": "/.netlify/functions/chat",
    "metadata": {}, // Include any custom data to send with each message to your n8n workflow
    "theme": {
      "button": {
        "backgroundColor": "#0095de",
        "right": 20,
        "bottom": 20,
        "size": 50,
        "iconColor": "#0d0d0d",
        "customIconSrc": "/lovable-uploads/duvida.gif",
        "customIconSize": 60,
        "customIconBorderRadius": 0,
        "autoWindowOpen": {
          "autoOpen": false,
          "openDelay": 2
        },
        "borderRadius": "rounded",
        "border": "2px solid #ffffff"
      },
      "tooltip": {
        "showTooltip": true,
        "tooltipMessage": "Falar com a IA",
        "tooltipBackgroundColor": "#0095de",
        "tooltipTextColor": "#fafafa",
        "tooltipFontSize": 10,
        "hideTooltipOnMobile": true
      },
      "allowProgrammaticMessage": false,
      "chatWindow": {
        "borderRadiusStyle": "rounded",
        "avatarBorderRadius": 25,
        "messageBorderRadius": 6,
        "showTitle": true,
        "title": "BPF Check",
        "titleAvatarSrc": "https://images.vexels.com/media/users/3/192572/isolated/preview/8ba723456bb4070b984ca8d227039e65-ilustracao-de-maca.png",
        "avatarSize": 40,
        "welcomeMessage": "Olá! 👋\nSeja bem-vindo(a)! Estou aqui para te ajudar com o uso do aplicativo e dúvidas sobre a RDC 216/2004.",
        "errorMessage": "entre contato com suporte",
        "backgroundColor": "#d9d9d9",
        "height": 600,
        "width": 400,
        "fontSize": 16,
        "starterPromptFontSize": 15,
        "renderHTML": false,
        "clearChatOnReload": false,
        "showScrollbar": false,
        "botMessage": {
          "backgroundColor": "#ffffff",
          "textColor": "#0d0c0c",
          "showAvatar": true,
          "avatarSrc": "https://www.svgrepo.com/show/334455/bot.svg",
          "showCopyToClipboardIcon": false
        },
        "userMessage": {
          "backgroundColor": "#ffffff",
          "textColor": "#080808",
          "showAvatar": true,
          "avatarSrc": "https://www.svgrepo.com/show/532363/user-alt-1.svg"
        },
        "textInput": {
          "placeholder": "Envie sua perguntar",
          "backgroundColor": "#fafafa",
          "textColor": "#1e1e1f",
          "sendButtonColor": "#0095de",
          "maxChars": 50,
          "maxCharsWarningMessage": "You exceeded the characters limit. Please input less than 50 characters.",
          "autoFocus": false,
          "borderRadius": 6,
          "sendButtonBorderRadius": 50
        }
      }
    }
    });
  </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
